# Render blueprint for the Unify API (notes-engine, combined app + authoring backend).
# Create via Render Dashboard > New > Blueprint > select this repo.
# Free tier sleeps after ~15 min idle: first request can take 30-60s.
# The web client (lib/api.ts) warms /healthz and retries once for this.
services:
  - type: web
    name: unify-api
    runtime: node
    rootDir: notes-engine
    plan: free
    buildCommand: npm install && node scripts/check-env.js && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: SUPABASE_URL
        sync: false # set in Render dashboard
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false # set in Render dashboard (aka legacy anon key)
      - key: SUPABASE_SECRET_KEY
        sync: false # set in Render dashboard (secret, aka legacy service_role)
      - key: DATABASE_URL
        sync: false # Supabase pooler :6543 (Prisma app traffic)
      - key: DIRECT_URL
        sync: false # Supabase direct :5432 (prisma migrate deploy)
      - key: CORS_ORIGIN
        value: https://unify-virid.vercel.app
      - key: ADMIN_EMAILS
        sync: false # comma-separated bootstrap admins, e.g. you@lasu.edu.ng
      - key: ANTHROPIC_API_KEY
        sync: false # optional: only for /api/convert authoring
      - key: AI_PROVIDER
        value: gemini # free tier; set 'anthropic' + ANTHROPIC_API_KEY to switch back
      - key: GEMINI_API_KEY
        sync: false # required when AI_PROVIDER=gemini (AI Studio key)
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_MODELS
        value: '' # optional explicit fallbacks only; never auto-downgrades
      - key: BREVO_API_KEY
        sync: false # optional: enables new-note email notifications (Brevo); unset = log-only
      - key: EMAIL_FROM
        value: 'Unify Learn <notes@unify.learn>' # must be a verified Brevo sender
      - key: VAPID_PUBLIC_KEY
        sync: false # web-push public key (generate: npx web-push generate-vapid-keys)
      - key: VAPID_PRIVATE_KEY
        sync: false # web-push private key (never commit)
      - key: VAPID_SUBJECT
        value: 'mailto:notes@unify.learn'
