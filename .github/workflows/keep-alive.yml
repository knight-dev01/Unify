# Keeps the Render free-tier backend warm + reports outages.
# Pings /healthz every 5 minutes (GitHub's minimum; cold starts get a 100s
# budget + 2 retries). Free-tier Render spins down after 15 min idle, and
# GitHub throttles schedules on quiet repos — real runs can lag 15-30+ min,
# so this is best-effort. For guaranteed warmth, also point a free external
# monitor (UptimeRobot 5-min HTTP check, or cron-job.org 1-min) at
# <API_URL>/healthz — that is the only GitHub-independent keep-alive.
# Needs repo secret RENDER_API_URL (e.g. https://unify-api.onrender.com, no
# trailing slash) or falls back to the live Render URL below. Run manually
# anytime via workflow_dispatch.
name: Backend keep-alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping healthz (cold-start tolerant)
        env:
          API_URL: ${{ secrets.RENDER_API_URL || 'https://unify-api-z4zm.onrender.com' }}
        run: |
          if [ -z "$API_URL" ]; then echo "RENDER_API_URL secret not set"; exit 1; fi
          for i in 1 2 3; do
            if curl --fail --max-time 100 "$API_URL/healthz"; then exit 0; fi
            echo "attempt $i failed, retrying in 20s..."
            sleep 20
          done
          echo "backend unreachable after 3 attempts"
          exit 1
