# Keeps the Render free-tier backend warm + reports outages.
# Pings /healthz every 12 minutes (cold starts get a 100s budget + 2 retries).
# Needs repo secret RENDER_API_URL (e.g. https://unify-api.onrender.com, no
# trailing slash). Run manually anytime via workflow_dispatch.
# For real alerting (email/SMS on downtime), add UptimeRobot's free plan on
# top pointing at the same /healthz URL.
name: Backend keep-alive

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz (cold-start tolerant)
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "RENDER_API_URL secret not set"; exit 1; fi
          for i in 1 2 3; do
            if curl --fail --max-time 100 "$API_URL/healthz"; then exit 0; fi
            echo "attempt $i failed, retrying in 20s..."
            sleep 20
          done
          echo "backend unreachable after 3 attempts"
          exit 1
