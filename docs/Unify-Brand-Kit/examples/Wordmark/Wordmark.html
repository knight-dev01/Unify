<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;900&family=DM+Sans:wght@400;500&display=swap">
<style>
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:24px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .tile{border-radius:var(--radius-lg);padding:32px 28px 28px;display:flex;flex-direction:column;gap:12px;min-height:150px;justify-content:center}
  .light{background:var(--off-white);color:var(--near-black);border:1px solid var(--border)}
  .dark{background:var(--near-black);color:var(--off-white)}
  .mark{font-family:var(--font-display);font-weight:900;font-size:56px;line-height:1;letter-spacing:-3px;margin:0}
  .mark i{font-style:normal;color:var(--green)}
  .tag{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.2em;text-transform:uppercase;margin:0}
  .cap{font-size:12px;color:var(--text-muted);margin:12px 0 0}
</style></head>
<body>
  <div class="row">
    <div class="tile light"><p class="mark">Unify<i>.</i></p><p class="tag">Built for the ones who build.</p></div>
    <div class="tile dark"><p class="mark">Unify<i>.</i></p><p class="tag">Built for the ones who build.</p></div>
  </div>
  <p class="cap">Wordmark and tagline are both Playfair Display. The tagline sits under the wordmark, left-aligned to the U.</p>
</body></html>
