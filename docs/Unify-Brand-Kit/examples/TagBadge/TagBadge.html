<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap">
<style>
  body{margin:0;background:var(--bg);padding:24px;font-family:var(--font-sans)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .tag{font:500 11px/16px var(--font-sans);padding:4px 12px;border-radius:var(--radius-pill);border:1px solid transparent;background:var(--tag-bg);color:var(--text-muted)}
  .tag.g{background:var(--green-tint);border-color:var(--green-tint-border);color:var(--green-text)}
  .badge{font:700 10px/14px var(--font-sans);padding:3px 10px;border-radius:var(--radius-pill)}
  .badge.g{background:var(--green);color:var(--on-green)}
  .badge.n{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text-muted)}
  .cap{font-size:12px;color:var(--text-muted);margin:0}
</style></head>
<body>
  <div class="row"><span class="tag">Differential Equations</span><span class="tag g">Control Theory</span><span class="tag g">Integral Transforms</span></div>
  <div class="row"><span class="badge g">v2</span><span class="badge n">v1</span><span class="badge n">Week 1</span></div>
  <p class="cap">Tags name a topic. Badges mark a version or state.</p>
</body></html>
